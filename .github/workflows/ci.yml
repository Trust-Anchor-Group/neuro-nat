# Builds NAT and runs the tests that need no Neuron, on every push and pull request.
# Live tests skip by themselves: they need the local test Neuron's NAT_TEST_* keys, which are not set here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Neuro.Nat.slnx

      - name: Build
        run: dotnet build Neuro.Nat.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Neuro.Nat.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=results"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
